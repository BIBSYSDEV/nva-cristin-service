[versions]
bekkopen-nocommons = { strictly = '0.17.0' }
json-assert = { strictly = '2.0-rc1' }
karate-core = { strictly = '1.4.1' }
karate-junit5 = { strictly = '1.4.1' }
nva-language = { strictly = '1.2.1' }
